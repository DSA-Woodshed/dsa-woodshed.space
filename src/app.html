<!doctype html>
<html lang="en" data-theme="xoxd" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- No static description tag here: the layout-level <SEOHead>
		     renders the ONE per-page description; a template-level tag would
		     stack a second, generic copy onto every prerendered page. -->
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
