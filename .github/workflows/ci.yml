name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: check / lint / unit / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Read the committed packet lock
        id: packet-lock
        run: nix develop --command node scripts/packet-lock.mjs --github-output
      - name: Check out the study packet
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.packet-lock.outputs.repository }}
          ref: ${{ steps.packet-lock.outputs.commit }}
          path: dsa-study-packet
      - name: Verify the locked packet checkout
        run: nix develop --command node scripts/packet-lock.mjs --verify-checkout "${{ github.workspace }}/dsa-study-packet"
      - name: Install public dependencies
        run: nix develop --command just setup
      - name: Sync content from the packet
        run: nix develop --command just sync-content
        env:
          WOODSHED_PACKET_PATH: ${{ github.workspace }}/dsa-study-packet
      - name: Verify the packet lock reproduced exactly
        run: |
          nix develop --command node scripts/packet-lock.mjs --verify-generated \
            "${{ steps.packet-lock.outputs.repository }}" \
            "${{ steps.packet-lock.outputs.commit }}" \
            "${{ steps.packet-lock.outputs.booklet_digest }}"
          git diff --exit-code -- src/content/.manifest.json static/capabilities.json
      - name: Run the public validation graph
        run: nix develop .#playwright --command just gate
        env:
          WOODSHED_PACKET_PATH: ${{ github.workspace }}/dsa-study-packet
      - name: Browser acceptance
        run: nix develop .#playwright --command pnpm exec playwright test
