name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'DSA-Woodshed/dsa-woodshed.space' && github.ref == 'refs/heads/main'
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Read the committed packet lock
        id: packet-lock
        run: nix develop --command node scripts/packet-lock.mjs --github-output
      - name: Check out the study packet
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.packet-lock.outputs.repository }}
          ref: ${{ steps.packet-lock.outputs.commit }}
          path: dsa-study-packet
      - name: Verify the locked packet checkout
        run: nix develop --command node scripts/packet-lock.mjs --verify-checkout "${{ github.workspace }}/dsa-study-packet"
      - name: Install public dependencies
        run: nix develop --command just setup
      - name: Sync content from the packet
        run: nix develop --command just sync-content
        env:
          WOODSHED_PACKET_PATH: ${{ github.workspace }}/dsa-study-packet
      - name: Verify the packet lock reproduced exactly
        run: |
          nix develop --command node scripts/packet-lock.mjs --verify-generated \
            "${{ steps.packet-lock.outputs.repository }}" \
            "${{ steps.packet-lock.outputs.commit }}" \
            "${{ steps.packet-lock.outputs.booklet_digest }}"
          git diff --exit-code -- src/content/.manifest.json static/capabilities.json
      - name: Build the exact public artifact
        run: nix develop .#playwright --command just build-ci
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          WOODSHED_PACKET_PATH: ${{ github.workspace }}/dsa-study-packet
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true

  deploy:
    if: github.repository == 'DSA-Woodshed/dsa-woodshed.space' && github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refuse an out-of-date main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify production serves this exact site and packet pair
        run: |
          node scripts/deployment-receipt.mjs --verify-url \
            "https://dsa-woodshed.space/deployment-receipt.json?site=${GITHUB_SHA}" \
            "$GITHUB_SHA"
